name: Publish immutable OCI release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: oci-release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ghostscript-printer-app

jobs:
  metadata:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      created: ${{ steps.release.outputs.created }}
      fsdk_version: ${{ steps.release.outputs.fsdk_version }}
      fsdk_ref: ${{ steps.release.outputs.fsdk_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag and metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(< VERSION)"
          if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            printf 'Tag %s does not match application version v%s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          # FSDK comes through fsdk-containers; the image labels record its pin
          # and tests/appliance-parity.sh checks them against the resolved graph.
          label() { sed -n "s/^[[:space:]]*'io\.projectbluefin\.fsdk\.$1': '\(.*\)'$/\1/p" elements/oci/ghostscript-printer-app.bst; }
          fsdk_version="$(label version)"
          fsdk_ref="$(label ref)"
          test -n "$fsdk_version"
          test -n "$fsdk_ref"
          {
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(git show -s --format=%cI HEAD)"
            echo "fsdk_version=$fsdk_version"
            echo "fsdk_ref=$fsdk_ref"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    env:
      BST_FLAGS: --config /src/ci/buildstream.conf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install --yes fuse3 podman skopeo
      - name: Build image
        run: just bst --network-retries 5 build oci/ghostscript-printer-app.bst
      - name: Build and verify FSDK appliance
        run: just verify
      - name: Add release config labels
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
          CREATED: ${{ needs.metadata.outputs.created }}
          FSDK_VERSION: ${{ needs.metadata.outputs.fsdk_version }}
          FSDK_REF: ${{ needs.metadata.outputs.fsdk_ref }}
        run: |
          set -euo pipefail
          source_image="ghcr.io/projectbluefin/ghostscript-printer-app:build"
          container="$(podman create "$source_image")"
          trap 'podman rm "$container" >/dev/null 2>&1 || true' EXIT
          podman commit --format oci \
            --change "LABEL org.opencontainers.image.version=$VERSION" \
            --change "LABEL org.opencontainers.image.revision=$REVISION" \
            --change "LABEL org.opencontainers.image.created=$CREATED" \
            --change "LABEL org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --change "LABEL io.projectbluefin.fsdk.version=$FSDK_VERSION" \
            --change "LABEL io.projectbluefin.fsdk.ref=$FSDK_REF" \
            "$container" "$source_image"
      - name: Log in and publish architecture image
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/ghostscript-printer-app"
          target="${image}:${VERSION}-${{ matrix.arch }}"
          echo "$GH_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if probe="$(skopeo inspect --creds "$GITHUB_ACTOR:$GH_TOKEN" "docker://${target}" 2>&1)"; then
            printf 'Refusing to overwrite immutable architecture tag %s\n' "$target" >&2
            exit 1
          elif [[ "${probe,,}" != *"manifest unknown"* && "${probe,,}" != *"name unknown"* ]]; then
            printf 'Could not prove architecture tag %s is absent: %s\n' "$target" "$probe" >&2
            exit 1
          fi
          podman push "ghcr.io/projectbluefin/ghostscript-printer-app:build" "docker://${target}"

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install registry tools
        run: sudo apt-get update && sudo apt-get install --yes fuse3 jq podman skopeo
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - name: Publish annotated multi-architecture index
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
          CREATED: ${{ needs.metadata.outputs.created }}
          FSDK_VERSION: ${{ needs.metadata.outputs.fsdk_version }}
          FSDK_REF: ${{ needs.metadata.outputs.fsdk_ref }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/ghostscript-printer-app"
          target="${image}:${VERSION}"
          authfile="$HOME/.docker/config.json"
          if probe="$(skopeo inspect --authfile "$authfile" "docker://${target}" 2>&1)"; then
            printf 'Refusing to overwrite immutable release tag %s\n' "$target" >&2
            exit 1
          elif [[ "${probe,,}" != *"manifest unknown"* && "${probe,,}" != *"name unknown"* ]]; then
            printf 'Could not prove release tag %s is absent: %s\n' "$target" "$probe" >&2
            exit 1
          fi
          for arch in amd64 arm64; do
            source="${image}:${VERSION}-$([[ "$arch" == amd64 ]] && echo x86_64 || echo aarch64)"
            actual="$(skopeo inspect --authfile "$authfile" "docker://${source}" | jq -r .Architecture)"
            [[ "$actual" == "$arch" ]]
            config="$(skopeo inspect --config --authfile "$authfile" "docker://${source}")"
            jq -e \
              --arg arch "$arch" \
              --arg version "$VERSION" \
              --arg revision "$REVISION" \
              --arg created "$CREATED" \
              --arg fsdk_version "$FSDK_VERSION" \
              --arg fsdk_ref "$FSDK_REF" \
              --arg source_url "https://github.com/${GITHUB_REPOSITORY}" \
              '.architecture == $arch and
               .config.User == "65532:65532" and
               .config.Entrypoint == ["/usr/bin/catatonit", "--", "/usr/bin/bash", "/usr/libexec/ghostscript-printer-app/container-entrypoint"] and
               .config.Labels["org.opencontainers.image.title"] == "ghostscript-printer-app" and
               .config.Labels["org.opencontainers.image.source"] == $source_url and
               .config.Labels["org.opencontainers.image.licenses"] == "Apache-2.0" and
               .config.Labels["org.opencontainers.image.version"] == $version and
               .config.Labels["org.opencontainers.image.revision"] == $revision and
               .config.Labels["org.opencontainers.image.created"] == $created and
               .config.Labels["io.projectbluefin.fsdk.version"] == $fsdk_version and
               .config.Labels["io.projectbluefin.fsdk.ref"] == $fsdk_ref' <<< "$config"
          done
          docker buildx imagetools create \
            --tag "$target" \
            --annotation "index:org.opencontainers.image.title=ghostscript-printer-app" \
            --annotation "index:org.opencontainers.image.description=Ghostscript Printer Application built from freedesktop-sdk" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$REVISION" \
            --annotation "index:org.opencontainers.image.created=$CREATED" \
            --annotation "index:io.projectbluefin.fsdk.version=$FSDK_VERSION" \
            --annotation "index:io.projectbluefin.fsdk.ref=$FSDK_REF" \
            "${image}:${VERSION}-x86_64" \
            "${image}:${VERSION}-aarch64"
          digest="$(skopeo inspect --authfile "$authfile" "docker://${target}" | jq -r .Digest)"
          [[ "$digest" == sha256:* ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Generate BuildStream-native SPDX SBOM
        run: just sbom
      - name: Sign image and attach signed SBOM
        id: evidence
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          sbom_digest="$(oras attach --format json --no-tty \
            --artifact-type application/vnd.spdx+json \
            --annotation org.opencontainers.image.title=ghostscript-printer-app-sbom \
            "${IMAGE}@${DIGEST}" \
            ghostscript-printer-app.spdx.json:application/spdx+json | jq -r .digest)"
          [[ "$sbom_digest" == sha256:* ]]
          cosign sign --yes "${IMAGE}@${sbom_digest}"
          echo "sbom-digest=$sbom_digest" >> "$GITHUB_OUTPUT"
      - name: Generate GitHub provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Verify published release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          SBOM_DIGEST: ${{ steps.evidence.outputs.sbom-digest }}
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
          CREATED: ${{ needs.metadata.outputs.created }}
          FSDK_VERSION: ${{ needs.metadata.outputs.fsdk_version }}
          FSDK_REF: ${{ needs.metadata.outputs.fsdk_ref }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/registry-actions.yml@refs/tags/v${VERSION}"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${SBOM_DIGEST}"
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$GITHUB_REPOSITORY"
          oras discover --format json "${IMAGE}@${DIGEST}" |
            jq -e --arg digest "$SBOM_DIGEST" '.referrers[] | select(.digest == $digest and .artifactType == "application/vnd.spdx+json")'
          raw="$(skopeo inspect --raw "docker://${IMAGE}@${DIGEST}")"
          [[ "$(jq -r '[.manifests[].platform.architecture] | sort | join(" ")' <<< "$raw")" == "amd64 arm64" ]]
          jq -e \
            --arg version "$VERSION" \
            --arg revision "$REVISION" \
            --arg created "$CREATED" \
            --arg fsdk_version "$FSDK_VERSION" \
            --arg fsdk_ref "$FSDK_REF" \
            --arg source_url "https://github.com/${GITHUB_REPOSITORY}" \
            '.annotations["org.opencontainers.image.title"] == "ghostscript-printer-app" and
             .annotations["org.opencontainers.image.source"] == $source_url and
             .annotations["org.opencontainers.image.version"] == $version and
             .annotations["org.opencontainers.image.revision"] == $revision and
             .annotations["org.opencontainers.image.created"] == $created and
             .annotations["org.opencontainers.image.licenses"] == "Apache-2.0" and
             .annotations["io.projectbluefin.fsdk.version"] == $fsdk_version and
             .annotations["io.projectbluefin.fsdk.ref"] == $fsdk_ref' <<< "$raw"
