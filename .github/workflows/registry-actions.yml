name: Publish signed OCI image

# Every push to testing (only the merge queue lands there, after its full
# native build and `just verify`) rebuilds, re-verifies and publishes; the
# publish job needs both verified builds. Reverting a PR is the rollback.
on:
  push:
    branches: [testing]
  workflow_dispatch:

# One publication at a time, newest pending wins; never cancel a running one.
concurrency:
  group: oci-publish
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ghostscript-printer-app

jobs:
  metadata:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      created: ${{ steps.release.outputs.created }}
      fsdk_version: ${{ steps.release.outputs.fsdk_version }}
      fsdk_ref: ${{ steps.release.outputs.fsdk_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/testing ]]; then
            printf 'Publish only from testing, not %s\n' "$GITHUB_REF" >&2
            exit 1
          fi
          version="$(< VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[1-9][0-9]*$ ]]
          # FSDK comes only through the fsdk-containers junction; read its pin
          # there, so a bare junction bump needs no committed FSDK metadata.
          junction_ref="$(sed -n 's/^[[:space:]]*ref: \([0-9a-f]\{40\}\)$/\1/p' elements/fsdk-containers.bst)"
          [[ "$junction_ref" =~ ^[0-9a-f]{40}$ ]]
          upstream="$(mktemp -d)"
          trap 'rm -rf "$upstream"' EXIT
          git -C "$upstream" init -q
          git -C "$upstream" fetch -q --depth=1 https://github.com/projectbluefin/fsdk-containers.git "$junction_ref"
          junction="$(git -C "$upstream" show FETCH_HEAD:elements/freedesktop-sdk.bst)"
          read -r fsdk_version fsdk_ref <<< "$(sed -n 's/^[[:space:]]*ref: freedesktop-sdk-\(.*\)-0-g\([0-9a-f]\{40\}\)$/\1 \2/p' <<< "$junction")"
          [[ -n "$fsdk_version" && "$fsdk_ref" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(git show -s --format=%cI HEAD)"
            echo "fsdk_version=$fsdk_version"
            echo "fsdk_ref=$fsdk_ref"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      CACHE_PREFIX: bst-v1-${{ matrix.arch }}-
      BST_FLAGS: --config /src/ci/buildstream.conf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install --yes fuse3 podman skopeo jq
      - name: Compute BuildStream cache key
        id: cache-key
        env:
          INPUTS_HASH: ${{ hashFiles('project.conf', 'elements/**', 'include/**', 'patches/**', 'files/**', 'Makefile', 'ghostscript-printer-app.c', 'ghostscript-printer-app.1', 'ghostscript-printer-app.service', 'testpage.ps', 'VERSION') }}
        run: echo "inputs=${CACHE_PREFIX}${INPUTS_HASH}-" >> "$GITHUB_OUTPUT"
      - name: Restore BuildStream cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/buildstream/cas
            ~/.cache/buildstream/artifacts
            ~/.cache/buildstream/source_protos
          key: ${{ steps.cache-key.outputs.inputs }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.cache-key.outputs.inputs }}
            ${{ env.CACHE_PREFIX }}
      - name: Install cosign
        continue-on-error: true
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Seed printing/base.bst from the signed printing-base-devel bundle
      # (fsdk-containers docs/skills/printing-base.md, rule 4). Never fails
      # the job: any error falls through to a local build of the base.
      - name: Seed printing base
        continue-on-error: true
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -uo pipefail
          base=fsdk-containers.bst:printing/base.bst
          show() {
            just bst -o arch "$ARCH" show --deps none --format "$1" "$base" 2>/dev/null |
              tail -n 1 | sed 's/\x1b\[[0-9;]*m//g'
          }
          KEY="$(show '%{full-key}')"
          if [[ ! "$KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::warning::printing base: cannot compute the ${ARCH} key; building it locally"
            exit 0
          fi
          if [[ "$(show '%{state}')" == cached ]]; then
            echo "printing base ${ARCH}-${KEY} is already cached"
            exit 0
          fi
          if ! ARCH="$ARCH" KEY="$KEY" bash -euo pipefail <<'SEED'
          REPO=ghcr.io/projectbluefin/printing-base-devel
          DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://${REPO}:${ARCH}-${KEY}")"
          cosign verify \
            --certificate-identity-regexp '^https://github.com/projectbluefin/fsdk-containers/.github/workflows/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REPO}@${DIGEST}" >/dev/null
          # Copy exactly the verified digest; never touch podman storage.
          bundle="$(mktemp -d)"
          trap 'rm -rf "${bundle}"' EXIT
          skopeo copy "docker://${REPO}@${DIGEST}" "dir:${bundle}"
          layer="$(jq -r '.layers[0].digest' "${bundle}/manifest.json" | cut -d: -f2)"
          tar -C ~/.cache/buildstream -xf "${bundle}/${layer}"
          SEED
          then
            echo "::warning::printing base: seeding ${ARCH}-${KEY} failed; building it locally"
          elif [[ "$(show '%{state}')" != cached ]]; then
            echo "::warning::printing base: ${ARCH}-${KEY} not verified or not cached after seeding; building it locally"
          else
            echo "printing base seeded from ${ARCH}-${KEY}"
          fi
      - name: Build image
        run: just bst --network-retries 5 build oci/ghostscript-printer-app.bst
      - name: Build and verify FSDK appliance
        run: just verify
      - name: Add release config labels and export OCI archive
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
          CREATED: ${{ needs.metadata.outputs.created }}
          FSDK_VERSION: ${{ needs.metadata.outputs.fsdk_version }}
          FSDK_REF: ${{ needs.metadata.outputs.fsdk_ref }}
        run: |
          set -euo pipefail
          source_image="ghcr.io/projectbluefin/ghostscript-printer-app:build"
          container="$(podman create "$source_image")"
          trap 'podman rm "$container" >/dev/null 2>&1 || true' EXIT
          podman commit --format oci \
            --change "LABEL org.opencontainers.image.version=$VERSION" \
            --change "LABEL org.opencontainers.image.revision=$REVISION" \
            --change "LABEL org.opencontainers.image.created=$CREATED" \
            --change "LABEL org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --change "LABEL io.projectbluefin.fsdk.version=$FSDK_VERSION" \
            --change "LABEL io.projectbluefin.fsdk.ref=$FSDK_REF" \
            "$container" "$source_image"
          podman save --format oci-archive -o "ghostscript-${{ matrix.arch }}.oci" "$source_image"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ghostscript-${{ matrix.arch }}
          path: ghostscript-${{ matrix.arch }}.oci
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ghostscript-*
          merge-multiple: true
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install registry tools
        run: sudo apt-get update && sudo apt-get install --yes fuse3 jq podman skopeo
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - name: Generate BuildStream-native SPDX SBOM
        run: just sbom
      # Everything is pushed, signed, attested and verified by digest; the
      # tags are created only in the final step, so a failed publication never
      # leaves a tagged, unsigned image behind.
      - name: Publish architecture manifests and OCI index by digest
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
          CREATED: ${{ needs.metadata.outputs.created }}
          FSDK_VERSION: ${{ needs.metadata.outputs.fsdk_version }}
          FSDK_REF: ${{ needs.metadata.outputs.fsdk_ref }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/ghostscript-printer-app"
          authfile="$HOME/.docker/config.json"
          tag="sha-${REVISION}"
          if probe="$(skopeo inspect --authfile "$authfile" "docker://${image}:${tag}" 2>&1)"; then
            printf 'Refusing to overwrite immutable commit tag %s:%s\n' "$image" "$tag" >&2
            exit 1
          elif [[ "${probe,,}" != *"manifest unknown"* && "${probe,,}" != *"name unknown"* ]]; then
            printf 'Could not prove commit tag %s:%s is absent: %s\n' "$image" "$tag" "$probe" >&2
            exit 1
          fi
          sources=()
          for arch in x86_64 aarch64; do
            platform="$([[ "$arch" == x86_64 ]] && echo amd64 || echo arm64)"
            archive="ghostscript-${arch}.oci"
            layout="$(tar -xOf "$archive" index.json)"
            jq -e '.manifests | length == 1' <<< "$layout" >/dev/null
            digest="$(jq -r '.manifests[0].digest' <<< "$layout")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            oras copy --from-oci-layout "${archive}@${digest}" "${image}@${digest}"
            source="${image}@${digest}"
            actual="$(skopeo inspect --no-tags --authfile "$authfile" "docker://${source}" | jq -r .Architecture)"
            [[ "$actual" == "$platform" ]]
            config="$(skopeo inspect --config --authfile "$authfile" "docker://${source}")"
            jq -e \
              --arg arch "$platform" \
              --arg version "$VERSION" \
              --arg revision "$REVISION" \
              --arg created "$CREATED" \
              --arg fsdk_version "$FSDK_VERSION" \
              --arg fsdk_ref "$FSDK_REF" \
              --arg source_url "https://github.com/${GITHUB_REPOSITORY}" \
              '.architecture == $arch and
               .config.User == "65532:65532" and
               .config.Entrypoint == ["/usr/bin/catatonit", "--", "/usr/bin/bash", "/usr/libexec/ghostscript-printer-app/container-entrypoint"] and
               .config.Labels["org.opencontainers.image.title"] == "ghostscript-printer-app" and
               .config.Labels["org.opencontainers.image.source"] == $source_url and
               .config.Labels["org.opencontainers.image.licenses"] == "Apache-2.0" and
               .config.Labels["org.opencontainers.image.version"] == $version and
               .config.Labels["org.opencontainers.image.revision"] == $revision and
               .config.Labels["org.opencontainers.image.created"] == $created and
               .config.Labels["io.projectbluefin.fsdk.version"] == $fsdk_version and
               .config.Labels["io.projectbluefin.fsdk.ref"] == $fsdk_ref' <<< "$config"
            sources+=("$source")
            echo "${arch}-digest=$digest" >> "$GITHUB_OUTPUT"
          done
          docker buildx imagetools create --dry-run \
            --tag "${image}:${VERSION}" \
            --annotation "index:org.opencontainers.image.title=ghostscript-printer-app" \
            --annotation "index:org.opencontainers.image.description=Ghostscript Printer Application built from freedesktop-sdk" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$REVISION" \
            --annotation "index:org.opencontainers.image.created=$CREATED" \
            --annotation "index:io.projectbluefin.fsdk.version=$FSDK_VERSION" \
            --annotation "index:io.projectbluefin.fsdk.ref=$FSDK_REF" \
            "${sources[@]}" > index.json
          digest="sha256:$(sha256sum index.json | cut -d' ' -f1)"
          oras manifest push --media-type application/vnd.oci.image.index.v1+json "${image}@${digest}" index.json
          [[ "$(skopeo inspect --raw --authfile "$authfile" "docker://${image}@${digest}" | sha256sum | cut -d' ' -f1)" == "${digest#sha256:}" ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign index and architecture manifests and attach signed SBOM
        id: evidence
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes --recursive "${IMAGE}@${DIGEST}"
          sbom_digest="$(oras attach --format json --no-tty \
            --artifact-type application/vnd.spdx+json \
            --annotation org.opencontainers.image.title=ghostscript-printer-app-sbom \
            "${IMAGE}@${DIGEST}" \
            ghostscript-printer-app.spdx.json:application/spdx+json | jq -r .digest)"
          [[ "$sbom_digest" == sha256:* ]]
          cosign sign --yes "${IMAGE}@${sbom_digest}"
          echo "sbom-digest=$sbom_digest" >> "$GITHUB_OUTPUT"
      - name: Generate GitHub provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Verify published release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          SBOM_DIGEST: ${{ steps.evidence.outputs.sbom-digest }}
          X86_64_DIGEST: ${{ steps.publish.outputs.x86_64-digest }}
          AARCH64_DIGEST: ${{ steps.publish.outputs.aarch64-digest }}
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
          CREATED: ${{ needs.metadata.outputs.created }}
          FSDK_VERSION: ${{ needs.metadata.outputs.fsdk_version }}
          FSDK_REF: ${{ needs.metadata.outputs.fsdk_ref }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/registry-actions.yml@${GITHUB_REF}"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${SBOM_DIGEST}"
          for arch_digest in "$X86_64_DIGEST" "$AARCH64_DIGEST"; do
            cosign verify \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${IMAGE}@${arch_digest}"
          done
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$GITHUB_REPOSITORY"
          oras discover --format json "${IMAGE}@${DIGEST}" |
            jq -e --arg digest "$SBOM_DIGEST" '.referrers[] | select(.digest == $digest and .artifactType == "application/vnd.spdx+json")'
          raw="$(skopeo inspect --raw "docker://${IMAGE}@${DIGEST}")"
          [[ "$(jq -r '[.manifests[].platform.architecture] | sort | join(" ")' <<< "$raw")" == "amd64 arm64" ]]
          [[ "$(jq -r '[.manifests[].digest] | sort | join(" ")' <<< "$raw")" == "$(printf '%s\n' "$X86_64_DIGEST" "$AARCH64_DIGEST" | sort | paste -sd ' ')" ]]
          jq -e \
            --arg version "$VERSION" \
            --arg revision "$REVISION" \
            --arg created "$CREATED" \
            --arg fsdk_version "$FSDK_VERSION" \
            --arg fsdk_ref "$FSDK_REF" \
            --arg source_url "https://github.com/${GITHUB_REPOSITORY}" \
            '.annotations["org.opencontainers.image.title"] == "ghostscript-printer-app" and
             .annotations["org.opencontainers.image.source"] == $source_url and
             .annotations["org.opencontainers.image.version"] == $version and
             .annotations["org.opencontainers.image.revision"] == $revision and
             .annotations["org.opencontainers.image.created"] == $created and
             .annotations["org.opencontainers.image.licenses"] == "Apache-2.0" and
             .annotations["io.projectbluefin.fsdk.version"] == $fsdk_version and
             .annotations["io.projectbluefin.fsdk.ref"] == $fsdk_ref' <<< "$raw"
      # sha-<commit> is immutable (refused above if present); <VERSION>, its
      # per-architecture tags and stable move to the newest verified testing
      # commit.
      - name: Tag the verified image
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          X86_64_DIGEST: ${{ steps.publish.outputs.x86_64-digest }}
          AARCH64_DIGEST: ${{ steps.publish.outputs.aarch64-digest }}
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
        run: |
          set -euo pipefail
          oras tag "${IMAGE}@${DIGEST}" "sha-${REVISION}"
          oras tag "${IMAGE}@${X86_64_DIGEST}" "${VERSION}-x86_64"
          oras tag "${IMAGE}@${AARCH64_DIGEST}" "${VERSION}-aarch64"
          oras tag "${IMAGE}@${DIGEST}" "${VERSION}"
          oras tag "${IMAGE}@${DIGEST}" stable
          for tag in "sha-${REVISION}" "${VERSION}" stable; do
            [[ "$(skopeo inspect --raw "docker://${IMAGE}:${tag}" | sha256sum | cut -d' ' -f1)" == "${DIGEST#sha256:}" ]]
          done
