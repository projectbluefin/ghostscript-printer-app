name: Update fsdk-containers base

# Keep the fsdk-containers junction (and with it FSDK and the shared printing
# base) current. FSDK is reached only through fsdk-containers, so this is the
# one dependency updater for it.
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

concurrency:
  group: update-base
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    name: Track fsdk-containers
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CACHE_PREFIX: bst-v1-x86_64-
      BST_FLAGS: --config /src/ci/buildstream.conf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: testing
          persist-credentials: false
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install --yes fuse3 podman skopeo jq
      - name: Track fsdk-containers
        id: track
        run: |
          set -euo pipefail
          junction=elements/fsdk-containers.bst
          commit() { sed -n -E 's/^ +ref: .*([0-9a-f]{40})$/\1/p' "$junction"; }
          old="$(commit)"
          just bst source track fsdk-containers.bst
          new="$(commit)"
          [[ "$old" =~ ^[0-9a-f]{40}$ && "$new" =~ ^[0-9a-f]{40}$ ]]
          # Keep the ref a plain commit: git_repo's project-wide git-describe
          # format would otherwise rewrite the same commit as a change.
          git checkout -- "$junction"
          if [[ "$new" == "$old" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            sed -i -E "s/^( +ref: ).*$/\1${new}/" "$junction"
            {
              echo "changed=true"
              echo "old=${old}"
              echo "new=${new}"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Synchronize source metadata
        if: steps.track.outputs.changed == 'true'
        env:
          OLD: ${{ steps.track.outputs.old }}
          NEW: ${{ steps.track.outputs.new }}
        run: |
          set -euo pipefail
          mkdir -p .bst/update-evidence
          python3 scripts/sync-fsdk-metadata.py --old "$OLD" --new "$NEW" |
            tee .bst/update-evidence/sources.txt
      - name: Compute BuildStream cache key
        id: cache-key
        if: steps.track.outputs.changed == 'true'
        env:
          INPUTS_HASH: ${{ hashFiles('project.conf', 'elements/**', 'include/**', 'patches/**', 'files/**', 'Makefile', 'ghostscript-printer-app.c', 'ghostscript-printer-app.1', 'ghostscript-printer-app.service', 'testpage.ps', 'VERSION') }}
        run: echo "inputs=${CACHE_PREFIX}${INPUTS_HASH}-" >> "$GITHUB_OUTPUT"
      - name: Restore BuildStream cache
        if: steps.track.outputs.changed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/buildstream/cas
            ~/.cache/buildstream/artifacts
            ~/.cache/buildstream/source_protos
          key: ${{ steps.cache-key.outputs.inputs }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.cache-key.outputs.inputs }}
            ${{ env.CACHE_PREFIX }}
      - name: Install cosign
        if: steps.track.outputs.changed == 'true'
        continue-on-error: true
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Seed printing/base.bst from the signed printing-base-devel bundle
      # (fsdk-containers docs/skills/printing-base.md, rule 4). Never fails
      # the job: any error falls through to a local build of the base.
      - name: Seed printing base
        if: steps.track.outputs.changed == 'true'
        continue-on-error: true
        env:
          ARCH: x86_64
        run: |
          set -uo pipefail
          base=fsdk-containers.bst:printing/base.bst
          show() {
            just bst -o arch "$ARCH" show --deps none --format "$1" "$base" 2>/dev/null |
              tail -n 1 | sed 's/\x1b\[[0-9;]*m//g'
          }
          KEY="$(show '%{full-key}')"
          if [[ ! "$KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::warning::printing base: cannot compute the ${ARCH} key; building it locally"
            exit 0
          fi
          if [[ "$(show '%{state}')" == cached ]]; then
            echo "printing base ${ARCH}-${KEY} is already cached"
            exit 0
          fi
          if ! ARCH="$ARCH" KEY="$KEY" bash -euo pipefail <<'SEED'
          REPO=ghcr.io/projectbluefin/printing-base-devel
          DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://${REPO}:${ARCH}-${KEY}")"
          cosign verify \
            --certificate-identity-regexp '^https://github.com/projectbluefin/fsdk-containers/.github/workflows/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REPO}@${DIGEST}" >/dev/null
          # Copy exactly the verified digest; never touch podman storage.
          bundle="$(mktemp -d)"
          trap 'rm -rf "${bundle}"' EXIT
          skopeo copy "docker://${REPO}@${DIGEST}" "dir:${bundle}"
          layer="$(jq -r '.layers[0].digest' "${bundle}/manifest.json" | cut -d: -f2)"
          tar -C ~/.cache/buildstream -xf "${bundle}/${layer}"
          SEED
          then
            echo "::warning::printing base: seeding ${ARCH}-${KEY} failed; building it locally"
          elif [[ "$(show '%{state}')" != cached ]]; then
            echo "::warning::printing base: ${ARCH}-${KEY} not verified or not cached after seeding; building it locally"
          else
            echo "printing base seeded from ${ARCH}-${KEY}"
          fi
      - name: Verify candidate before write credentials
        if: steps.track.outputs.changed == 'true'
        run: |
          set -euo pipefail
          just verify-cups-patch-chain 2>&1 | tee .bst/update-evidence/patch-chain.log
          just fetch 2>&1 | tee .bst/update-evidence/fetch.log
          just verify 2>&1 | tee .bst/update-evidence/verify.log
      # BuildStream's session summaries distinguish local cache, remote pulls
      # and local builds. Keep the actual results, including failed runs.
      - name: Retain source and cache evidence
        if: always() && steps.track.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fsdk-update-evidence
          path: .bst/update-evidence/
          include-hidden-files: true
      - name: Mint Mergeraptor token
        if: steps.track.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}
          # A fork's per-repo installation lookup (GET /repos/{owner}/{repo}/installation) 404s;
          # owner: switches to the owner-level lookup, which resolves from a fork (fsdk-containers#331).
          owner: ${{ github.repository_owner }}
      - name: Propose the update
        if: steps.track.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          OLD: ${{ steps.track.outputs.old }}
          NEW: ${{ steps.track.outputs.new }}
        run: |
          set -euo pipefail
          bot_email='267480593+mergeraptor[bot]@users.noreply.github.com'
          base_branch=deps/fsdk-containers
          title="chore(deps): update fsdk-containers to ${NEW:0:12}"
          git config user.name 'mergeraptor[bot]'
          git config user.email "$bot_email"

          remote="https://github.com/${REPOSITORY}.git"
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          auth_git() {
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" "$@"
          }

          # Find the first candidate branch name (deps/fsdk-containers,
          # deps/fsdk-containers-2, ...) that is safe to reuse: either it
          # doesn't exist yet, or its current tip was produced entirely by
          # mergeraptor[bot] (checking both author and committer email, so an
          # amend or rebase that keeps the original author but changes the
          # committer is still treated as reviewer-owned). The first
          # non-bot-owned branch encountered is reported as a conflict.
          branch=""
          remote_head=""
          conflict=false
          conflicted_branch=""
          n=1
          while :; do
            candidate="$base_branch"
            [[ "$n" -gt 1 ]] && candidate="${base_branch}-${n}"
            head="$(git ls-remote "$remote" "refs/heads/$candidate" | cut -f1)"
            if [[ -z "$head" ]]; then
              branch="$candidate"
              break
            fi
            auth_git fetch "$remote" "$candidate"
            tip_author="$(git log -1 --format='%ae' FETCH_HEAD)"
            tip_committer="$(git log -1 --format='%ce' FETCH_HEAD)"
            if [[ "$tip_author" == "$bot_email" && "$tip_committer" == "$bot_email" ]]; then
              branch="$candidate"
              remote_head="$head"
              break
            fi
            if [[ "$conflict" == "false" ]]; then
              conflict=true
              conflicted_branch="$candidate"
            fi
            n=$((n + 1))
          done

          git switch --create "$branch"
          git add elements/fsdk-containers.bst VERSION elements/printer-app/ijs.bst \
            elements/oci/ghostscript-printer-app.bst README.md \
            examples/ghostscript-printer-app-usb.container
          git commit --signoff -m "$title"

          if [[ -n "$remote_head" ]]; then
            # Reusing a bot-owned branch: atomically refuse the push if the
            # remote head has moved since we inspected it (e.g. a concurrent
            # human edit landed between the fetch above and this push).
            if ! auth_git push --force-with-lease="$branch:$remote_head" "$remote" "HEAD:refs/heads/$branch"; then
              printf '::error::Refusing to force-push %s: its head moved since inspection, which looks like a reviewer edit landed concurrently. Re-run this workflow once the branch settles.\n' "$branch"
              exit 1
            fi
          else
            auth_git push "$remote" "HEAD:refs/heads/$branch"
          fi

          if [[ "$conflict" == "true" ]]; then
            printf '::warning::%s has commits not authored and committed by mergeraptor[bot]; a reviewer appears to have amended it. Opened %s instead of overwriting it.\n' "$conflicted_branch" "$branch"
            # Only post this notice the first time the proposal branch is
            # created (remote_head empty means $branch did not exist yet).
            # Once it exists, every subsequent scheduled run reuses it via
            # force-with-lease, and would otherwise repeat this comment on
            # the reviewer's open PR once per day for as long as it stays
            # open.
            if [[ -z "$remote_head" ]]; then
              if existing="$(gh pr list --head "$conflicted_branch" --base testing --state open --json number --jq '.[0].number')" && [[ -n "$existing" ]]; then
                gh pr comment "$existing" --body "A new scheduled fsdk-containers update was proposed on \`$branch\` instead of updating this branch, because this branch has commits not authored and committed by mergeraptor[bot] (a reviewer appears to have amended it). This PR was left untouched to avoid a destructive overwrite."
              fi
            fi
          fi

          body="Moves the fsdk-containers junction (FSDK and the shared printing base) from ${OLD} to ${NEW}: https://github.com/projectbluefin/fsdk-containers/compare/${OLD}...${NEW}"
          if [[ "$conflict" == "true" ]]; then
            body="$body"$'\n\n'"This is a fresh proposal branch: \`$conflicted_branch\` has commits not authored and committed by mergeraptor[bot], so it was left untouched instead of being force-pushed over."
          fi
          body_file="$(mktemp)"
          {
            printf '%s\n\n' "$body"
            cat .bst/update-evidence/sources.txt
            printf '\nVerified with patch-chain, fetch and full OCI socket-sink gates on x86_64. Physical paper output remains unverified.\n'
            printf '\nSource/cache evidence: https://github.com/%s/actions/runs/%s (fsdk-update-evidence artifact). Native arm64 verification remains a merge-queue gate.\n' "$REPOSITORY" "$GITHUB_RUN_ID"
          } > "$body_file"
          if existing="$(gh pr list --head "$branch" --base testing --state open --json number --jq '.[0].number')" && [[ -n "$existing" ]]; then
            gh pr edit "$existing" --title "$title" --body-file "$body_file"
            printf 'Updated dependency PR #%s\n' "$existing"
          else
            gh pr create --base testing --head "$branch" --title "$title" --body-file "$body_file"
          fi
