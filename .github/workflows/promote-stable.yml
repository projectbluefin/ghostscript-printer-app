name: Promote verified Ghostscript testing commit to stable

on:
  workflow_dispatch:
    inputs:
      testing_sha:
        description: Exact testing commit to rebuild and promote
        required: true
        type: string

permissions: {}
concurrency:
  group: ghostscript-stable-promotion
  cancel-in-progress: false

jobs:
  verify:
    name: Verify OCI image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      CACHE_PREFIX: bst-v1-${{ matrix.arch }}-
      # Every bst call, including those inside just recipes, uses the CI
      # user config (source cache override, network retries).
      BST_FLAGS: --config /src/ci/buildstream.conf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.testing_sha }}
          persist-credentials: false
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install --yes fuse3 podman skopeo jq
      - name: Compute BuildStream cache key
        id: cache-key
        env:
          INPUTS_HASH: ${{ hashFiles('project.conf', 'elements/**', 'include/**', 'patches/**', 'files/**', 'Makefile', 'ghostscript-printer-app.c', 'ghostscript-printer-app.1', 'ghostscript-printer-app.service', 'testpage.ps', 'VERSION') }}
        run: echo "inputs=${CACHE_PREFIX}${INPUTS_HASH}-" >> "$GITHUB_OUTPUT"
      - name: Restore BuildStream cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/buildstream/cas
            ~/.cache/buildstream/artifacts
            ~/.cache/buildstream/source_protos
          key: ${{ steps.cache-key.outputs.inputs }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.cache-key.outputs.inputs }}
            ${{ env.CACHE_PREFIX }}
      - name: Install cosign
        continue-on-error: true
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Seed printing/base.bst from the signed printing-base-devel bundle
      # (fsdk-containers docs/skills/printing-base.md, rule 4). Never fails
      # the job: any error falls through to a local build of the base.
      - name: Seed printing base
        continue-on-error: true
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -uo pipefail
          base=fsdk-containers.bst:printing/base.bst
          show() {
            just bst -o arch "$ARCH" show --deps none --format "$1" "$base" 2>/dev/null |
              tail -n 1 | sed 's/\x1b\[[0-9;]*m//g'
          }
          KEY="$(show '%{full-key}')"
          if [[ ! "$KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::warning::printing base: cannot compute the ${ARCH} key; building it locally"
            exit 0
          fi
          if [[ "$(show '%{state}')" == cached ]]; then
            echo "printing base ${ARCH}-${KEY} is already cached"
            exit 0
          fi
          if ! ARCH="$ARCH" KEY="$KEY" bash -euo pipefail <<'SEED'
          REPO=ghcr.io/projectbluefin/printing-base-devel
          DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://${REPO}:${ARCH}-${KEY}")"
          cosign verify \
            --certificate-identity-regexp '^https://github.com/projectbluefin/fsdk-containers/.github/workflows/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REPO}@${DIGEST}" >/dev/null
          # Copy exactly the verified digest; never touch podman storage.
          bundle="$(mktemp -d)"
          trap 'rm -rf "${bundle}"' EXIT
          skopeo copy "docker://${REPO}@${DIGEST}" "dir:${bundle}"
          layer="$(jq -r '.layers[0].digest' "${bundle}/manifest.json" | cut -d: -f2)"
          tar -C ~/.cache/buildstream -xf "${bundle}/${layer}"
          SEED
          then
            echo "::warning::printing base: seeding ${ARCH}-${KEY} failed; building it locally"
          elif [[ "$(show '%{state}')" != cached ]]; then
            echo "::warning::printing base: ${ARCH}-${KEY} not verified or not cached after seeding; building it locally"
          else
            echo "printing base seeded from ${ARCH}-${KEY}"
          fi
      - name: Build and verify real OCI printer image
        run: just bst --network-retries 5 build oci/ghostscript-printer-app.bst && just verify

  promote:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.testing_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fast-forward stable only from verified testing HEAD
        env:
          CANDIDATE: ${{ inputs.testing_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE" ]]
          git fetch origin testing stable
          [[ "$(git rev-parse origin/testing)" == "$CANDIDATE" ]]
          git merge-base --is-ancestor origin/stable "$CANDIDATE"
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $basic" \
            push origin "$CANDIDATE:refs/heads/stable"
