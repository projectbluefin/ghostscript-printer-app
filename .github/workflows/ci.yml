name: CI

on:
  pull_request: {}
  push:
    branches: [testing]
  merge_group:
  workflow_dispatch:
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


permissions: {}

jobs:
  build-fsdk:
    name: FSDK (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      FULL_BUILD: ${{ github.event_name != 'pull_request' }}
      CACHE_PREFIX: bst-v1-${{ matrix.arch }}-
      BST_FLAGS: --config /src/ci/buildstream.conf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: just
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install --yes fuse3 podman skopeo jq
      - name: Validate BuildStream graph
        if: env.FULL_BUILD != 'true'
        run: just validate
      - name: Compute BuildStream cache key
        id: cache-key
        if: env.FULL_BUILD == 'true'
        env:
          INPUTS_HASH: ${{ hashFiles('project.conf', 'elements/**', 'include/**', 'patches/**', 'files/**', 'Makefile', 'ghostscript-printer-app.c', 'ghostscript-printer-app.1', 'ghostscript-printer-app.service', 'testpage.ps', 'VERSION') }}
        run: echo "inputs=${CACHE_PREFIX}${INPUTS_HASH}-" >> "$GITHUB_OUTPUT"
      - name: Restore BuildStream cache
        if: env.FULL_BUILD == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/buildstream/cas
            ~/.cache/buildstream/artifacts
            ~/.cache/buildstream/source_protos
          key: ${{ steps.cache-key.outputs.inputs }}${{ github.run_id }}
          restore-keys: |
            ${{ steps.cache-key.outputs.inputs }}
            ${{ env.CACHE_PREFIX }}
      - name: Install cosign
        if: env.FULL_BUILD == 'true'
        continue-on-error: true
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Seed printing/base.bst from the signed printing-base-devel bundle
      # (fsdk-containers docs/skills/printing-base.md, rule 4). Never fails
      # the job: any error falls through to a local build of the base.
      - name: Seed printing base
        if: env.FULL_BUILD == 'true'
        continue-on-error: true
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -uo pipefail
          base=fsdk-containers.bst:printing/base.bst
          show() {
            just bst -o arch "$ARCH" show --deps none --format "$1" "$base" 2>/dev/null |
              tail -n 1 | sed 's/\x1b\[[0-9;]*m//g'
          }
          KEY="$(show '%{full-key}')"
          if [[ ! "$KEY" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::warning::printing base: cannot compute the ${ARCH} key; building it locally"
            exit 0
          fi
          if [[ "$(show '%{state}')" == cached ]]; then
            echo "printing base ${ARCH}-${KEY} is already cached"
            exit 0
          fi
          if ! ARCH="$ARCH" KEY="$KEY" bash -euo pipefail <<'SEED'
          REPO=ghcr.io/projectbluefin/printing-base-devel
          DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://${REPO}:${ARCH}-${KEY}")"
          cosign verify \
            --certificate-identity-regexp '^https://github.com/projectbluefin/fsdk-containers/.github/workflows/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${REPO}@${DIGEST}" >/dev/null
          # Copy exactly the verified digest; never touch podman storage.
          bundle="$(mktemp -d)"
          trap 'rm -rf "${bundle}"' EXIT
          skopeo copy "docker://${REPO}@${DIGEST}" "dir:${bundle}"
          layer="$(jq -r '.layers[0].digest' "${bundle}/manifest.json" | cut -d: -f2)"
          tar -C ~/.cache/buildstream -xf "${bundle}/${layer}"
          SEED
          then
            echo "::warning::printing base: seeding ${ARCH}-${KEY} failed; building it locally"
          elif [[ "$(show '%{state}')" != cached ]]; then
            echo "::warning::printing base: ${ARCH}-${KEY} not verified or not cached after seeding; building it locally"
          else
            echo "printing base seeded from ${ARCH}-${KEY}"
          fi
      - name: Build image
        if: env.FULL_BUILD == 'true'
        run: just bst --config /src/ci/buildstream.conf --network-retries 5 build oci/ghostscript-printer-app.bst
      - name: Build and verify FSDK appliance
        if: env.FULL_BUILD == 'true'
        run: just verify

  # The Snap package (snap/snapcraft.yaml) is a separate, independently
  # maintained artifact and not a product of this repository's CI. Its build
  # must not live in this gate, whose sole job is to verify the FSDK OCI
  # container contract. A flaky non-OCI build here would either obscure the
  # FSDK results or force a container-only promotion to be blocked for an
  # unrelated packaging reason. Keep the real-image gate above strict: any
  # failed FSDK job fails the gate.
  actionlint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint v1.7.12
        run: |
          curl -fsSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c
          tar -xzf actionlint.tar.gz actionlint
      - name: Run actionlint
        run: ./actionlint -color
